# Empacotamento Windows (NSIS). `npm run pack` gera o app descompactado; `npm run dist` gera o instalador.
appId: br.fabricadeclipe.app
productName: Fábrica de Clipe
directories: { output: release }
electronDist: node_modules/electron/dist
files: [dist/**, public/**, node_modules/three/build/**, node_modules/ffmpeg-static/**, node_modules/ffprobe-static/bin/win32/x64/**, node_modules/ffprobe-static/index.js, node_modules/ffprobe-static/package.json, package.json]
asarUnpack: [node_modules/ffmpeg-static/**, node_modules/ffprobe-static/**]
asar: true
win:
  target: [{ target: nsis, arch: [x64] }]
  # icon: resources/icons/icon.ico   (pendente: ícone oficial)
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false   # projetos e dados do usuário nunca são apagados na desinstalação
  artifactName: Fabrica-de-Clipe-Setup-${version}.exe
